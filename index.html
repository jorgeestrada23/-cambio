<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa De Cambio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <header> 
        <h1>Casa De Cambio</h1>
    </header>

    <main>
        <section>
            <h2>Cambiar dinero</h2>
            <form id="form-cambio" novalidate>
                <p>
                    <label for="select-moneda">Moneda que queres comprar:</label><br>
                    <select id="select-moneda"></select>
                </p>
                <p>
                    <label for="monto">Monto en pesos argentinos (ARS):</label><br>
                    <input type="number" id="monto" min="0.01" step="0.01" placeholder="Ej: 15000">
                </p>
                <button type="submit">Cambiar</button>
            </form>
            <p id="resultado"></p>
        </section>

        <hr>

        <section>
            <h2>Monedas disponibles</h2>
            <p>
                <label for="buscador">Buscar moneda (filtra mientras escribis):</label><br>
                <input type="text" id="buscador" placeholder="Ej: USD o euro" autocomplete="off">
            </p>
            <button type="button" id="btn-actualizar">Actualizar cotizaciones</button>
            <p id="estado-carga" role="status" aria-live="polite"></p>

            <ul id="lista-monedas"></ul>

            <h3>Top 3 de mayor cotizacion</h3>
            <ol id="lista-top"></ol>
        </section>

        <hr>

        <section>
            <h2>Historial de operaciones</h2>
            <ul id="lista-operaciones"></ul>
            <p id="total-operaciones"></p>
            <button type="button" id="btn-borrar-historial">Borrar historial</button>
            <button type="button" id="btn-restablecer">Restablecer simulador</button>
        </section>
    </main>

    <footer>
        <p> &copy; 2026 Casa De Cambio. Todos los derechos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="index.js"></script>
</body>
</html>
